name: Build ClavinTool APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Unpacks the project zip FIRST, whatever it is called (spaces / brackets / "(1)" are fine) and wherever
      # it was uploaded in the repo. If the project is already unpacked, that is used instead.
      - name: Unpack the project zip and locate the project
        run: |
          echo "Files in the repo:"
          find . -maxdepth 3 -not -path './.git/*' -not -path './.git' | sort | head -80

          if [ -f settings.gradle ]; then
            DIR=.
          else
            mkdir -p _src
            N=0
            # every .zip in the repo that contains a Gradle project gets unpacked
            while IFS= read -r -d '' z; do
              if unzip -l "$z" > "$RUNNER_TEMP/zip_list.txt" 2>/dev/null && grep -q 'settings.gradle' "$RUNNER_TEMP/zip_list.txt"; then
                N=$((N+1))
                echo "Unpacking: $z"
                mkdir -p "_src/$N"
                unzip -o -q "$z" -d "_src/$N"
              else
                echo "Skipping (no Gradle project inside): $z"
              fi
            done < <(find . -iname '*.zip' -not -path './_src/*' -not -path './.git/*' -print0)

            # candidates: every settings.gradle that is not inside a build/cache folder
            BEST=""
            while IFS= read -r s; do
              if grep -qi 'clavintool' "$s"; then BEST="$s"; break; fi   # prefer the ClavinTool project
              [ -z "$FIRST" ] && FIRST="$s"
            done < <(find . -name settings.gradle -not -path './.git/*' -not -path '*/node_modules/*' | awk '{ print length($0) " " $0 }' | sort -n | cut -d' ' -f2-)
            SETTINGS="${BEST:-$FIRST}"

            if [ -z "$SETTINGS" ]; then
              echo "::error::No Gradle project (settings.gradle) found - not unpacked and not in any zip. Upload the project zip (clavintool.zip) to the repo."
              exit 1
            fi
            DIR=$(dirname "$SETTINGS")
          fi
          echo "Project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Make sure NDK + CMake are installed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" || true

      - name: Build APK with native Lua 5.3
        id: native
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace -PwithNative=true

      - name: Fallback build (Lua 5.2 only) if the native build failed
        if: steps.native.outcome == 'failure'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "::warning::Native Lua 5.3 build FAILED - building a fallback APK with the Lua 5.2 engine. Open the 'Build APK with native Lua 5.3' step and send me the error."
          gradle assembleDebug --no-daemon --stacktrace -PwithNative=false

      - uses: actions/upload-artifact@v4
        with:
          name: ClavinTool-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
